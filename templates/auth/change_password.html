{% extends "base.html" %}

{% block title %}修改個人密碼 - 1151 SE 管院空間系統{% endblock %}

{% block content %}
<h1>修改個人密碼</h1>
<p>為保護帳號安全，請先輸入您目前的舊密碼，並設定至少 8 字元的新密碼（新密碼必須輸入兩次確認）。</p>
<form method="post" action="/auth/change-password">
  <p>
    <label>目前舊密碼：<br>
      <input type="password" name="old_password" minlength="8" maxlength="128" autocomplete="current-password" required autofocus>
    </label>
  </p>
  <p>
    <label>設定新密碼：<br>
      <input type="password" name="new_password" minlength="8" maxlength="128" autocomplete="new-password" required>
    </label>
    <small>（至少 8 字元）</small>
  </p>
  <p>
    <label>確認新密碼：<br>
      <input type="password" name="confirm_password" minlength="8" maxlength="128" autocomplete="new-password" required>
    </label>
    <small>（請再次輸入新密碼）</small>
  </p>
  <p>
    <button type="submit">確認修改密碼</button>
  </p>
</form>
{% endblock %}
