{% extends "base.html" %}
{% block title %}登入{% endblock %}
{% block content %}
<h1>登入</h1>
<form class="account" action="/auth/login" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>帳號 <input name="username" value="{{ username|default('') }}" autocomplete="username" required></label>
  <label>密碼 <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">登入</button>
</form>
{% endblock %}
