{% extends "base.html" %}

{% block title %}登入 - 1151 SE 管院空間系統{% endblock %}

{% block content %}
<h1>登入系統</h1>
<form method="post" action="/auth/login">
  <p>
    <label>帳號：<br>
      <input name="username" autocomplete="username" pattern="[A-Za-z0-9_.\-]{3,40}" required autofocus>
    </label>
    <small>（3–40 個英數字、底線、點或短橫線）</small>
  </p>
  <p>
    <label>密碼：<br>
      <input type="password" name="password" minlength="8" maxlength="128" autocomplete="current-password" required>
    </label>
    <small>（至少 8 字元）</small>
  </p>
  <p>
    <button type="submit">登入</button>
  </p>
</form>
<p>還沒有帳號？<a href="/auth/register">前往註冊</a></p>
{% endblock %}
