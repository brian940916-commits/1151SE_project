{% extends "base.html" %}
{% block title %}註冊帳號{% endblock %}
{% block content %}
<h1>註冊帳號</h1>
<form class="account" action="/auth/register" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>帳號 <small>3–40 個英數字、點、底線或短橫線</small>
    <input name="username" value="{{ username|default('') }}" pattern="[A-Za-z0-9_.\-]{3,40}" autocomplete="username" required>
  </label>
  <label>密碼 <small>至少 8 個字元</small><input type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
  <label>確認密碼 <input type="password" name="confirm_password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
  <label>申請身分 <select name="role"><option value="student">學生</option><option value="teacher" {% if role == 'teacher' %}selected{% endif %}>老師</option></select></label>
  <small>學生註冊後可直接登入。老師帳號須經管理員核准。</small>
  <button type="submit">送出申請</button>
</form>
{% endblock %}
